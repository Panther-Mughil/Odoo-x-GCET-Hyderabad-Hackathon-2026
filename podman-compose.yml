version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stocksense_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stocksense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: stocksense_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/stocksense
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
